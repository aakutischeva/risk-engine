global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    retries 2
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout check 5s

frontend postgres_rw
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    mode tcp

    option httpchk GET /primary
    http-check expect status 200

    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

    server pg-primary postgres:5432 check port 8008
    server pg-standby postgres-standby:5432 check port 8008
