services:
  api:
    build:
      context: .
      target: production
    container_name: risk-engine-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    networks:
      - tx_db
      - tx_cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
         condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
  migrate:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    networks:
      - tx_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: risk-engine-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tx_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: risk-engine-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - tx_cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: risk-engine-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: risk_engine
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - events
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
      target: production
    container_name: risk-engine-outbox-publisher
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: risk_engine
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    command: ["python", "-m", "app.workers.outbox_publisher"]
    networks:
      - tx_db
      - events
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  alert-postgres:
    image: postgres:16-alpine
    container_name: risk-engine-alert-postgres
    environment:
      POSTGRES_USER: ${ALERT_POSTGRES_USER:?ALERT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${ALERT_POSTGRES_DB:?ALERT_POSTGRES_DB is required}
    volumes:
      - alert_postgres_data:/var/lib/postgresql/data
    networks:
      - alert_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALERT_POSTGRES_USER} -d ${ALERT_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  alert-migrate:
    build:
      context: ./alert_notifier
    environment:
      ALERT_DB_HOST: alert-postgres
      ALERT_DB_PORT: "5432"
      ALERT_DB_USER: ${ALERT_POSTGRES_USER:?ALERT_POSTGRES_USER is required}
      ALERT_DB_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      ALERT_DB_NAME: ${ALERT_POSTGRES_DB:?ALERT_POSTGRES_DB is required}
    command: ["alembic", "-c", "alert_notifier/alembic.ini", "upgrade", "head"]
    networks:
      - alert_db
    depends_on:
      alert-postgres:
        condition: service_healthy
    restart: "no"

  alert-notifier:
    build:
      context: ./alert_notifier
    container_name: risk-engine-alert-notifier
    environment:
      ALERT_DB_HOST: alert-postgres
      ALERT_DB_PORT: "5432"
      ALERT_DB_USER: ${ALERT_POSTGRES_USER:?ALERT_POSTGRES_USER is required}
      ALERT_DB_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      ALERT_DB_NAME: ${ALERT_POSTGRES_DB:?ALERT_POSTGRES_DB is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: risk_engine
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    command: ["python", "-m", "alert_notifier.consumer"]
    networks:
      - events
      - alert_db
    depends_on:
      alert-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  notification-receiver:
    # Deliberately local demo endpoint: no host port is published.
    build:
      context: ./alert_notifier
    container_name: risk-engine-notification-receiver
    environment:
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?NOTIFICATION_WEBHOOK_SECRET is required}
    command: ["python", "-m", "alert_notifier.demo_receiver"]
    networks:
      - webhook
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  alert-dispatcher:
    build:
      context: ./alert_notifier
    container_name: risk-engine-alert-dispatcher
    environment:
      ALERT_DB_HOST: alert-postgres
      ALERT_DB_PORT: "5432"
      ALERT_DB_USER: ${ALERT_POSTGRES_USER:?ALERT_POSTGRES_USER is required}
      ALERT_DB_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?ALERT_POSTGRES_PASSWORD is required}
      ALERT_DB_NAME: ${ALERT_POSTGRES_DB:?ALERT_POSTGRES_DB is required}
      NOTIFICATION_WEBHOOK_URL: http://notification-receiver:8080/webhook
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?NOTIFICATION_WEBHOOK_SECRET is required}
    command: ["python", "-m", "alert_notifier.dispatcher"]
    networks:
      - alert_db
      - webhook
    depends_on:
      alert-migrate:
        condition: service_completed_successfully
      notification-receiver:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
networks:
  # Explicit east-west segmentation. Containers not sharing a network
  # cannot reach one another by Compose service name.
  tx_db:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-re-txdb
  tx_cache:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-re-cache
  events:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-re-events
  alert_db:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-re-alertdb
  webhook:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-re-hook
volumes:
  postgres_data:
  rabbitmq_data:
  alert_postgres_data:
