global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    option tcplog
    retries 2
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

resolvers docker
    nameserver docker-dns 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

frontend rabbitmq_amqp
    bind *:5672
    default_backend rabbitmq_nodes

backend rabbitmq_nodes
    mode tcp
    balance roundrobin

    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

    server rabbit1 rabbitmq:5672 check resolvers docker init-addr libc,none
    server rabbit2 rabbitmq-2:5672 check resolvers docker init-addr libc,none
    server rabbit3 rabbitmq-3:5672 check resolvers docker init-addr libc,none
